name: CD

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  check:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.tag.outputs.should_deploy }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect v* tag on commit
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAGS=$(git tag --points-at "$HEAD_SHA" "v*")
          if [ -z "$TAGS" ]; then
            echo "No v* tag on $HEAD_SHA — skipping deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found tag(s): $TAGS"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find CI run for commit
        id: ci
        if: steps.tag.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          RUN_ID=$(gh run list \
            --workflow=ci.yml \
            --branch=main \
            --commit="$HEAD_SHA" \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful CI run found for $HEAD_SHA"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using CI run $RUN_ID"

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download web-dist from CI
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.check.outputs.ci_run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
