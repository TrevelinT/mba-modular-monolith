name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Resolve Turbo SCM range
        run: |
          echo "TURBO_SCM_HEAD=${GITHUB_SHA}" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "TURBO_SCM_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Release window: previous v* tag (HEAD^ so a tag on HEAD is skipped)
            if PREV_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null); then
              echo "TURBO_SCM_BASE=$(git rev-parse "$PREV_TAG")" >> "$GITHUB_ENV"
              echo "workflow_dispatch base: $PREV_TAG"
            else
              echo "TURBO_SCM_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
              echo "workflow_dispatch base: HEAD^ (no previous v* tag)"
            fi
          else
            # push with empty/zero before (new branch)
            echo "TURBO_SCM_BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run format-and-lint

      - name: Build
        run: npm run build

      - name: Report build artifacts
        run: node scripts/report-build-artifacts.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

      - name: Type check
        run: npx turbo run type-check --affected

      - name: Test
        run: |
          npx turbo run test --affected
          coverage_files=(
            apps/web/coverage/coverage-final.json
            packages/cart/coverage/coverage-final.json
            packages/buy-box/coverage/coverage-final.json
            packages/product/coverage/coverage-final.json
          )
          found=0
          for f in "${coverage_files[@]}"; do
            if [ -f "$f" ]; then
              found=1
              break
            fi
          done
          if [ "$found" -eq 1 ]; then
            npm run merge-coverage
            npm run report-coverage
          else
            echo "No package coverage reports found; skipping merge/report."
          fi

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Install Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run E2E tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e --workspace=web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
